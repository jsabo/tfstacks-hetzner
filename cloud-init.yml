#cloud-config
---
package_update: true
package_upgrade: true

users:
  - name: ubuntu
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh-authorized-keys:
      # Replace this with the content of your ~/.ssh/id_rsa.pub
      - ssh-rsa  sabo@sabos-mbp.lan
    lock-passwd: true
    shell: /bin/bash

ssh_pwauth: false
disable_root: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - containerd

write_files:
  # SSH hardening configuration
  - path: /etc/ssh/sshd_config.d/secure-ssh.conf
    owner: root:root
    permissions: '0644'
    content: |
      # Disable root SSH login
      PermitRootLogin no

      # Disable password authentication
      PasswordAuthentication no
      PermitEmptyPasswords no
      ChallengeResponseAuthentication no

      # Use only SSH protocol 2
      Protocol 2

      # Enable pubkey authentication
      PubkeyAuthentication yes

      # Disable SSH agent forwarding and X11 forwarding
      AllowAgentForwarding no
      X11Forwarding no

      # Disable TCP forwarding
      AllowTcpForwarding no

      # Set cryptographic algorithms
      KexAlgorithms curve25519-sha256@libssh.org
      Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
      MACs hmac-sha2-512,hmac-sha2-256

      # Limit login attempts and sessions
      MaxAuthTries 3
      MaxSessions 2

      # SSH idle timeout settings
      ClientAliveInterval 300
      ClientAliveCountMax 2
      LoginGraceTime 60

  # Kernel modules needed for Kubernetes
  - path: /etc/modules-load.d/k8s.conf
    owner: root:root
    permissions: '0644'
    content: |
      overlay
      br_netfilter

  # Sysctl settings for Kubernetes networking
  - path: /etc/sysctl.d/k8s.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
runcmd:
  # Load kernel modules and apply sysctl
  - [ modprobe, overlay ]
  - [ modprobe, br_netfilter ]
  - [ sysctl, --system ]

  # Disable swap as required by Kubernetes
  - [ swapoff, -a ]
  - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

  # Configure Kubernetes apt repository (v1.34 - current stable)
  - [ mkdir, -p, -m, "755", /etc/apt/keyrings ]
  - bash -c "curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"
  - bash -c "echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /' > /etc/apt/sources.list.d/kubernetes.list"

  # Install Kubernetes components
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl

  # Configure containerd to use systemd cgroups (recommended for kubeadm)
  - mkdir -p /etc/containerd
  - bash -c "containerd config default > /etc/containerd/config.toml"
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl enable containerd
  - systemctl restart containerd

  # Restart SSH to pick up hardening configuration
  - systemctl restart sshd

